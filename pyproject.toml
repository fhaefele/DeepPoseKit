[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepposekit"
version = "0.6.0"
description = "A toolkit for pose estimation using deep learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Graving", email = "jgraving@gmail.com" }]
maintainers = [{ name = "Jacob Graving", email = "jgraving@gmail.com" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "argcomplete>=3.5,<4",
    "h5py",
    "imgaug==0.4.0",
    "keras==3.15.1",
    "matplotlib",
    # imgaug 0.4.0 uses NumPy 1.x APIs.
    "numpy>=1.26,<2",
    # OpenCV wheels from 4.12 onward require NumPy 2 on Python 3.12.
    "opencv-python<4.12",
    "pandas",
    "pyyaml",
    "rich-argparse>=1.7,<2",
    "scikit-learn",
    "torch==2.11.0",
]

[project.optional-dependencies]
gpu = [
    "torch==2.11.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
deepposekit = "deepposekit.cli:console_main"

[project.urls]
Homepage = "https://github.com/jgraving/DeepPoseKit"

[dependency-groups]
cpu = ["torch==2.11.0"]

[tool.uv]
default-groups = ["cpu"]
conflicts = [[{ group = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
py-modules = ["_deepposekit_gpu"]

[tool.setuptools.packages.find]
include = ["deepposekit*"]
namespaces = false

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepposekit"
version = "0.6.0"
description = "A toolkit for pose estimation using deep learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Graving", email = "jgraving@gmail.com" }]
maintainers = [{ name = "Jacob Graving", email = "jgraving@gmail.com" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "argcomplete>=3.5,<4",
    "h5py",
    "imaug @ git+https://github.com/fhaefele/imaug.git@aae67b11e42d3c380ebccb30d1f7a481598b8f7d",
    "keras==3.15.1",
    "matplotlib",
    # Use the same NumPy version range as the GSOR imgaug baseline.
    "numpy>=1.26,<2",
    # OpenCV wheels from 4.12 onward require NumPy 2 on Python 3.12.
    "opencv-python<4.12",
    "pandas",
    "pyyaml",
    "rich-argparse>=1.7,<2",
    "scikit-learn",
    "tensorflow==2.21.0",
]

[project.optional-dependencies]
gpu = [
    "tensorflow[and-cuda]==2.21.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
deepposekit = "deepposekit.cli:console_main"

[project.urls]
Homepage = "https://github.com/jgraving/DeepPoseKit"

[tool.setuptools]
py-modules = ["_deepposekit_gpu"]

[tool.setuptools.packages.find]
include = ["deepposekit*"]
namespaces = false
